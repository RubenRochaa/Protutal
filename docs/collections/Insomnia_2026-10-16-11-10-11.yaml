              modified: 1792250000000
              isPrivate: false
              description: >-
                Esperado: 404 - Aluno não encontrado

                Caso: id_aluno 99999, que não existe.

                Pré-requisito: a sala 1 precisa ser do professor do token; se
                não for, a resposta é 403.
